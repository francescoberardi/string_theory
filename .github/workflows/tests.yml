name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  server-tests:
    name: Serverpod Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: '4.0.3'
      SERVERPOD_PASSWORD_database: 'WdpOsfODtQAerx3UBObqFkOTBCt0-BzX'
      SERVERPOD_PASSWORD_redis: 'U66M8P1Mmb6Bc935BI4d5lghgtEbwfgJ'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      # The test config sets `database.dataPath`, so the tests run against an
      # embedded PostgreSQL that Serverpod starts itself. No Docker needed.
      # The binaries are downloaded once and cached here between runs. The
      # bundle changes with the Serverpod version, so the version is in the key.
      - name: Cache embedded PostgreSQL binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/serverpod/pg-binaries
          key: serverpod-pg-binaries-${{ runner.os }}-${{ env.VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: |
          dart install serverpod_cli@$VERSION
          # `dart install` puts executables in the Dart data home, which is not
          # on the PATH of a GitHub runner.
          echo "${XDG_STATE_HOME:-$HOME/.local/state}/Dart/install/bin" >> "$GITHUB_PATH"

      - name: Run Serverpod generator check
        working-directory: string_theory_server
        run: |
          serverpod generate
          git diff --exit-code lib/src/generated/ ../string_theory_client
          if [ -n "$(git status --porcelain lib/src/generated/ ../string_theory_client)" ]; then
            echo "::error::Uncommitted or untracked Serverpod generated files detected."
            git status --porcelain lib/src/generated/ ../string_theory_client
            exit 1
          fi

      - name: Run tests
        working-directory: string_theory_server
        run: dart test

  flutter-tests:
    name: Flutter Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        working-directory: string_theory_flutter
        run: flutter test
