name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  decay-engine-tests:
    name: Decay Engine Package Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        working-directory: string_theory_decay_engine
        run: dart test

  server-tests:
    name: Serverpod Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: '4.0.3'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      # The test config sets `database.dataPath`, so the tests run against an
      # embedded PostgreSQL that Serverpod starts itself. No Docker needed.
      # The binaries are downloaded once and cached here between runs. The
      # bundle changes with the Serverpod version, so the version is in the key.
      - name: Cache embedded PostgreSQL binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/serverpod/pg-binaries
          key: serverpod-pg-binaries-${{ runner.os }}-${{ env.VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: |
          dart install serverpod_cli@$VERSION
          # `dart install` puts executables in the Dart data home, which is not
          # on the PATH of a GitHub runner.
          echo "${XDG_STATE_HOME:-$HOME/.local/state}/Dart/install/bin" >> "$GITHUB_PATH"

      # Scope rule: check only the generated code, i.e. the server's
      # lib/src/generated/ and the string_theory_client package. A repo-wide
      # diff trips on files the runner rewrites itself, such as pubspec.lock
      # after `flutter pub get`.
      - name: Run Serverpod generator check
        working-directory: string_theory_server
        run: |
          serverpod generate
          git diff --exit-code lib/src/generated/ ../string_theory_client
          if [ -n "$(git status --porcelain lib/src/generated/ ../string_theory_client)" ]; then
            echo "::error::Uncommitted or untracked Serverpod generated files detected."
            git status --porcelain lib/src/generated/ ../string_theory_client
            exit 1
          fi

      # The secrets come from the same script a fresh clone runs, so CI and
      # local setups always have the same set. No SERVERPOD_PASSWORD_* env.
      - name: Generate test secrets
        working-directory: string_theory_server
        run: ./tool/init_passwords.sh

      - name: Run tests
        working-directory: string_theory_server
        run: dart test

  migration-verify:
    name: UUID Tenant Migration Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      postgres:
        image: ghcr.io/serverpod/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      # Seeds a database at the last bigint-tenant migration, applies the
      # later migrations, and checks data and schema against definition.sql.
      - name: Verify migration on a populated database
        working-directory: string_theory_server
        run: ./tool/verify_uuid_migration.sh

  flutter-tests:
    name: Flutter Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        working-directory: string_theory_flutter
        run: flutter test

      # dart2js integer semantics differ from the VM (e.g. `1 << 32` is 0), so
      # the simulated workout id generator is also tested on the web compiler.
      - name: Run web-sensitive tests on Chrome
        working-directory: string_theory_flutter
        run: flutter test --platform chrome test/services/health/simulated_health_sync_service_test.dart

      - name: Run Patrol headless E2E tests
        working-directory: string_theory_flutter
        run: flutter test test/patrol/app_patrol_test.dart

      - name: Build web
        working-directory: string_theory_flutter
        run: flutter build web
